services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: news_intelligence_app
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/news_intelligence
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=prod-secret-key-replace-in-production-vault
      - MODEL_DEVICE=cpu
      - SUMMARIZATION_MODEL=sshleifer/distilbart-cnn-12-6
      - SENTIMENT_MODEL=distilbert-base-uncased-finetuned-sst-2-english
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - audio_cache:/app/audio_cache

  postgres:
    image: postgres:16-alpine
    container_name: news_intelligence_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: news_intelligence
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: news_intelligence_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  audio_cache:
